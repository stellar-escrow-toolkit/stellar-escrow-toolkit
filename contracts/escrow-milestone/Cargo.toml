[package]
name = "escrow-milestone"
version = "0.1.0"
edition = "2021"
description = "Milestone and phased payout escrow contract on Soroban"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
